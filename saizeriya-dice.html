<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サイゼリヤダイス</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column shaped like a paper order slip — 4 digit boxes, roll button, then the running order list */
:root {
  --bg: #eef1ec;
  --paper: #ffffff;
  --ink: #1f2a22;
  --muted: #66716a;
  --line: #d4dbd5;
  --green: #1d7a3e;
  --red: #c8352b;
  --zero: #8a948d;
  --hit-bg: #e8f4ec;
  --miss-bg: #f6ecea;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141916; --paper: #1d2420; --ink: #e8ede9; --muted: #9aa69e; --line: #313b35;
    --green: #4fbf74; --red: #f0685c; --zero: #7d8882; --hit-bg: #1d3325; --miss-bg: #3a2422;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141916; --paper: #1d2420; --ink: #e8ede9; --muted: #9aa69e; --line: #313b35;
  --green: #4fbf74; --red: #f0685c; --zero: #7d8882; --hit-bg: #1d3325; --miss-bg: #3a2422;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
header p { margin: 2px 0 0; color: var(--muted); font-size: .82rem; }

.slip { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.slip-label { font-size: .75rem; color: var(--muted); letter-spacing: .12em; }
.digits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.digit { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.box {
  width: 100%; aspect-ratio: 3 / 4; max-width: 100%;
  border: 4px solid var(--green); border-radius: 6px;
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: clamp(2.4rem, 12vw, 3.6rem); line-height: 1;
  color: var(--green); background: var(--paper);
  font-variant-numeric: tabular-nums;
}
.digit.d4 .box { border-color: var(--red); color: var(--red); }
.digit.fixed .box { border-color: var(--zero); color: var(--zero); border-style: dashed; }
.die { font-size: .8rem; font-weight: 700; color: var(--green); }
.digit.d4 .die { color: var(--red); }
.digit.fixed .die { color: var(--zero); }
.box.rolling { opacity: .55; }

.roll {
  font-family: var(--font-display); font-size: 1.25rem; letter-spacing: .06em;
  border: 0; border-radius: 12px; padding: 14px; cursor: pointer;
  background: var(--green); color: var(--paper);
  box-shadow: 0 4px 0 color-mix(in srgb, var(--green) 60%, #000);
  transition: transform .08s, box-shadow .08s;
}
.roll:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--green) 60%, #000); }
.roll:disabled { opacity: .7; cursor: wait; }
.roll:focus-visible, button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

.result { border-radius: 10px; padding: 12px 14px; min-height: 64px; display: flex; flex-direction: column; justify-content: center; }
.result.idle { background: var(--bg); color: var(--muted); font-size: .9rem; }
.result.hit { background: var(--hit-bg); }
.result.miss { background: var(--miss-bg); }
.result .tag { font-size: .72rem; font-weight: 700; letter-spacing: .1em; }
.result.hit .tag { color: var(--green); }
.result.miss .tag { color: var(--red); }
.result .name { font-weight: 700; font-size: 1.05rem; }
.result .sub { font-size: .85rem; color: var(--muted); }

.list-card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.list-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.list-head h2 { margin: 0; font-size: 1rem; font-weight: 700; }
.clear { font: inherit; font-size: .82rem; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.clear.confirm { border-color: var(--red); color: var(--red); font-weight: 700; }
.clear:disabled { opacity: .4; cursor: default; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 10px; padding: 10px 8px 10px 16px; border-bottom: 1px solid var(--line); }
li:last-child { border-bottom: 0; }
.code { font-family: var(--font-display); font-size: .85rem; color: var(--paper); background: var(--ink); border-radius: 4px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
.item-name { min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.price { font-variant-numeric: tabular-nums; white-space: nowrap; }
.del { border: 0; background: none; color: var(--muted); font-size: 1.2rem; line-height: 1; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; }
.del:hover { background: var(--miss-bg); color: var(--red); }
.empty { padding: 22px 16px; color: var(--muted); font-size: .9rem; text-align: center; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px; background: var(--bg); border-top: 1px solid var(--line); }
.total strong { font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.total span { color: var(--muted); font-size: .85rem; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px; cursor: pointer; font-weight: 500; }
.switch small { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; }
.switch input { appearance: none; -webkit-appearance: none; flex: none; width: 46px; height: 26px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked { background: var(--green); }
.switch input:checked::after { transform: translateX(20px); }
.switch input:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
footer { color: var(--muted); font-size: .75rem; line-height: 1.7; }
@media (prefers-reduced-motion: reduce) { .roll { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>サイゼリヤダイス</h1>
    <p>ダイスで4桁の注文番号を作って、出たメニューを注文リストに追加します</p>
  </header>

  <section class="slip" aria-label="注文番号">
    <div class="slip-label">注文番号</div>
    <div class="digits">
      <div class="digit d3"><div class="box" id="b0">?</div><div class="die">1d3</div></div>
      <div class="digit d4"><div class="box" id="b1">?</div><div class="die">1d4</div></div>
      <div class="digit fixed"><div class="box" id="b2">0</div><div class="die">0固定</div></div>
      <div class="digit d10"><div class="box" id="b3">?</div><div class="die">1d10</div></div>
    </div>
    <label class="switch" for="noalc"><span>ノンアルコール<small>ビール・ワインなどお酒の番号は該当なし扱い</small></span><input type="checkbox" id="noalc" role="switch"></label>
    <button class="roll" id="roll" type="button">ダイスを振る</button>
    <div class="result idle" id="result" aria-live="polite">ボタンを押すと番号が決まります。該当するメニューがあれば、そのまま注文リストに入ります。</div>
  </section>

  <section class="list-card" aria-label="注文リスト">
    <div class="list-head">
      <h2>注文リスト <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
      <button class="clear" id="clear" type="button">全部消す</button>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty">まだ何もありません。ダイスを振るとここに追加されます。</div>
    <div class="total"><span>合計（税込）</span><strong id="total">0円</strong></div>
  </section>

  <footer>
    非公式のファンツールです。メニューと価格は2026年6月版メニューブック（税込）をもとにしています。店舗によって取り扱いが異なる場合があります。夜10時以降の深夜料金は含みません。
  </footer>
</div>

<script>
const MENU = [
  // 前菜・おつまみ
  [1401,"辛味チキン",300],[1402,"アロスティチーニ",400],[1403,"ほうれん草のソテー",200],
  [1404,"ポップコーンシュリンプ",300],[1405,"エスカルゴのオーブン焼き",400],[1406,"小エビのカクテル",280],
  [1407,"チョリソー",400],[1408,"蒸し鶏の香味ソース",280],[1410,"ムール貝のガーリック焼き",400],
  [1413,"キャロットラペ",200],[1416,"ポテトのグリル",300],[1417,"バッファローモッツァレラのカプレーゼ",430],
  [1422,"生ハム",320],[1423,"生ハムとバッファローモッツァレラの盛合せ",500],[1425,"柔らか青豆の温サラダ",200],
  [1452,"アロスティチーニ Wサイズ",800],
  // サラダ
  [1202,"小エビのサラダ",350],[1205,"わかめのサラダ",350],[1209,"チキンのサラダ",350],
  // スープ
  [1301,"コーンクリームスープ",150],[1302,"冷たいパンプキンスープ",180],[1305,"田舎風ミネストローネ",300],[1307,"たまねぎのズッパ",300],
  // ドリア・グラタン
  [2101,"ミラノ風ドリア",300],[2103,"半熟卵のミラノ風ドリア",350],[2108,"焼チーズ ミラノ風ドリア",350],
  [2110,"タラコとポップコーンシュリンプのドリア",400],[2115,"ポップコーンシュリンプとタラコのクリームグラタン",430],
  // ピザ
  [2203,"バッファローモッツァレラのマルゲリータピザ",400],[2204,"野菜ときのこのピザ",400],[2206,"たっぷりコーンのピザ",400],[2208,"ソーセージピザ",400],
  // パスタ
  [2301,"タラコソースシシリー風",400],[2303,"ペペロンチーノ",300],[2304,"パルマ風スパゲッティ",400],
  [2305,"カルボナーラ",500],[2306,"ミートソースボロニア風",400],[2310,"スープ入り塩味ボンゴレ",500],
  [2316,"半熟卵のミートソースボロニア風",450],[2317,"半熟卵のペペロンチーノ",350],[2318,"半熟卵のカルボナーラ",550],
  [2320,"小エビのタラコソース",540],[2321,"きのことほうれん草のクリームスパゲッティ",600],
  [2325,"ペンネアラビアータ",430],[2328,"イカの墨入りセピアソース",500],
  // 肉料理
  [2403,"イタリアンハンバーグ",500],[2406,"ハンバーグステーキ",400],[2407,"ディアボラ風ハンバーグ",500],
  [2417,"ラム(仔羊)のランプステーキ",1090],[2418,"ミックスグリル",650],[2419,"ビーフステーキ",1090],
  // ライス・パン
  [3101,"ライス",150],[3102,"ラージライス",200],[3103,"スモールライス",100],
  [3110,"フォッカチオ",150],[3111,"ガーリックフォッカチオ",200],[3112,"シナモンフォッカチオ",200],
  [3113,"タラコフォッカチオ",250],[3114,"チーズフォッカチオ",250],
  // デザート（すぐに）
  [3201,"ティラミス クラシコ",300],[3205,"ミルクジェラート",250],[3206,"イタリアンプリン",250],
  [3207,"チョコレートケーキ",300],[3212,"プリンとティラミス クラシコの盛合せ",500],[3213,"トリフアイスクリーム",350],
  [3214,"ジェラート&シナモンフォッカチオ",450],[3215,"コーヒーゼリー&ミルクジェラート",350],[3216,"チョコレートケーキ&ミルクジェラート",500],
  // ドリンク
  [3301,"生ビール ジョッキ",400],[3302,"生ビール グラス",280],[3303,"アサヒ ドライゼロ（ノンアル）",250],
  [3304,"キリン 氷結 シチリア産レモン",350],[3306,"グラッパ",300],
  [3401,"グラスワイン 赤",100],[3402,"グラスワイン 白",100],[3403,"デカンタ小 赤",200],[3404,"デカンタ小 白",200],
  [3405,"デカンタ大 赤",400],[3406,"デカンタ大 白",400],[3407,"マグナム 赤",1100],[3408,"マグナム 白",1100],
  [3412,"ランブルスコロゼ",1100],[3413,"ドンラファエロ",1100],[3414,"ランブルスコセッコ",1100],
  [3415,"ベルデッキオ",1100],[3416,"キャンティ",1100],[3419,"キャンティ ルフィナ",2200],
  [5101,"セットドリンクバー",200],[5102,"ドリンクバー キッズ",100],[5103,"ドリンクバー 単品",300],
  [4301,"トッピング半熟卵",50],[4304,"トッピング野菜ソース",100],[4307,"トッピング粉チーズ",100],
  [5305,"サイゼリヤドレッシング",500],[5306,"エクストラ・バージン・オリーブオイル",1200]
];
const BY_CODE = new Map(MENU.map(([c, n, p]) => [String(c), { name: n, price: p }]));
const KEY = "saize-dice-list-v1";
const ALC_KEY = "saize-dice-noalc-v1";
// お酒の番号（3303 アサヒ ドライゼロはノンアルコールなので含めない）
const ALCOHOL = new Set(["3301","3302","3304","3306","3401","3402","3403","3404","3405","3406","3407","3408","3412","3413","3414","3415","3416","3419"]);

const $ = id => document.getElementById(id);
const boxes = [$("b0"), $("b1"), $("b2"), $("b3")];
const yen = n => n.toLocaleString("ja-JP") + "円";
const rnd = n => Math.floor(Math.random() * n);
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let list = [];
try { list = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { list = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} };

function render() {
  const ul = $("list");
  ul.innerHTML = "";
  list.forEach((item, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="code"></span><span class="item-name"></span><span class="price"></span><button class="del" type="button" aria-label="削除">×</button>`;
    li.querySelector(".code").textContent = item.code;
    li.querySelector(".item-name").textContent = item.name;
    li.querySelector(".price").textContent = yen(item.price);
    li.querySelector(".del").addEventListener("click", () => { list.splice(i, 1); save(); render(); });
    ul.appendChild(li);
  });
  $("empty").hidden = list.length > 0;
  $("count").textContent = list.length ? `${list.length}品` : "";
  $("total").textContent = yen(list.reduce((s, x) => s + x.price, 0));
  $("clear").disabled = list.length === 0;
  resetClear();
}

function roll() {
  const final = [rnd(3) + 1, rnd(4) + 1, 0, rnd(10)];
  const btn = $("roll");
  btn.disabled = true;
  const finish = () => {
    final.forEach((v, i) => { boxes[i].textContent = v; boxes[i].classList.remove("rolling"); });
    btn.disabled = false;
    showResult(final.join(""));
  };
  if (reduceMotion) return finish();
  const stopAt = [450, 600, 0, 750];
  const start = performance.now();
  [0, 1, 3].forEach(i => boxes[i].classList.add("rolling"));
  const tick = () => {
    const t = performance.now() - start;
    [[0, 3, 1], [1, 4, 1], [3, 10, 0]].forEach(([i, n, base]) => {
      if (t < stopAt[i]) boxes[i].textContent = rnd(n) + base;
      else { boxes[i].textContent = final[i]; boxes[i].classList.remove("rolling"); }
    });
    if (t < 750) setTimeout(tick, 55); else finish();
  };
  tick();
}

function showResult(code) {
  const r = $("result");
  const hit = BY_CODE.get(code);
  if (hit && ALCOHOL.has(code) && document.getElementById("noalc").checked) {
    r.className = "result miss";
    r.innerHTML = `<span class="tag">${code} はお酒のため除外</span><span class="name"></span><span class="sub">ノンアルコールがオンなので追加しません。もう一度振ってください。</span>`;
    r.querySelector(".name").textContent = hit.name;
    return;
  }
  if (hit) {
    list.push({ code, name: hit.name, price: hit.price });
    save(); render();
    r.className = "result hit";
    r.innerHTML = `<span class="tag">${code} を注文リストに追加</span><span class="name"></span><span class="sub"></span>`;
    r.querySelector(".name").textContent = hit.name;
    r.querySelector(".sub").textContent = yen(hit.price) + "（税込）";
  } else {
    r.className = "result miss";
    r.innerHTML = `<span class="tag">${code} は該当なし</span><span class="sub">このメニュー番号はありません。もう一度振ってください。</span>`;
  }
}

let clearTimer = null;
function resetClear() {
  clearTimeout(clearTimer);
  const b = $("clear");
  b.classList.remove("confirm");
  b.textContent = "全部消す";
}
$("clear").addEventListener("click", () => {
  const b = $("clear");
  if (b.classList.contains("confirm")) {
    list = []; save(); render();
    const r = $("result");
    r.className = "result idle";
    r.textContent = "注文リストを空にしました。";
    return;
  }
  b.classList.add("confirm");
  b.textContent = "もう一度押すと消えます";
  clearTimer = setTimeout(resetClear, 3000);
});
$("roll").addEventListener("click", roll);
try { $("noalc").checked = localStorage.getItem(ALC_KEY) === "1"; } catch (e) {}
$("noalc").addEventListener("change", e => { try { localStorage.setItem(ALC_KEY, e.target.checked ? "1" : "0"); } catch (err) {} });
render();
</script>
</body>
</html>
